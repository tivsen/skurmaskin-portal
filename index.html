<!DOCTYPE html>
<html lang="sv" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12352c">
  <meta name="robots" content="noindex">
  <meta name="google" content="notranslate">
  <meta name="description" content="Rapportera att skurmaskinen har körts på ett objekt. Inget namn sparas.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Skurmaskin">
  <title>Skurmaskin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-report">
  <header class="hero">
    <div class="wrap hero-bar">
      <img class="logo" src="favicon.svg" alt="" width="44" height="44">
      <div class="hero-text">
        <p class="eyebrow">Städrapport</p>
        <h1>Skurmaskin</h1>
      </div>
      <a class="hero-link" href="dashboard.html">Översikt</a>
    </div>
    <div class="wrap">
      <p class="lede">Tryck på objektet du har kört. Datum och tid fylls i automatiskt. Ditt namn sparas inte.</p>
    </div>
  </header>
  <main class="wrap">
    <noscript><p class="notice">Slå på JavaScript för att använda sidan.</p></noscript>
    <div id="notice" class="notice" hidden></div>
    <div class="search-wrap">
      <label class="search">
        <span class="sr">Sök objekt</span>
        <input id="search" type="search" placeholder="Sök objekt" autocomplete="off" autocapitalize="none" enterkeyhint="search">
      </label>
      <p id="count" class="count"></p>
    </div>
    <div id="list" class="objekt-list"></div>
    <p class="foot">Inget namn sparas. Tiderna är svensk tid.</p>
  </main>

  <dialog id="sheet" aria-labelledby="sheet-title">
    <form id="confirm-view" class="sheet" novalidate>
      <div class="grab" aria-hidden="true"></div>
      <p class="eyebrow">Bekräfta</p>
      <h2 id="sheet-title" class="confirm-name"><span class="sr">Bekräfta </span><span id="confirm-name"></span></h2>
      <p class="hint">Har skurmaskinen körts här?</p>
      <label class="field">När?
        <input id="when" type="datetime-local" step="60" autocomplete="off">
      </label>
      <p id="when-preview" class="time-preview"></p>
      <p class="hint">Förifyllt med nu. Ändra om du rapporterar i efterhand.</p>
      <p id="confirm-note" class="note" hidden></p>
      <p id="form-error" class="form-error" hidden></p>
      <button type="submit" class="btn-primary" id="confirm-btn">Bekräfta</button>
      <button type="button" class="btn-ghost" id="cancel-btn">Avbryt</button>
    </form>
    <div id="done-view" class="sheet sheet-center" hidden>
      <div class="grab" aria-hidden="true"></div>
      <div class="success-mark" aria-hidden="true">✓</div>
      <h2 id="done-heading">Klart!</h2>
      <p id="done-text" class="done-text"></p>
      <p id="done-time" class="time-preview"></p>
      <p id="done-note" class="note" hidden></p>
      <button type="button" class="btn-primary" id="done-btn">Rapportera ett till</button>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="shared.js"></script>
  <script src="app.js"></script>
</body>
</html>
